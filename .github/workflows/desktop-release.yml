# Desktop companion releases (OD-DESK-3): GitHub Releases, as a *draft* the
# owner publishes by hand.
#
#   macOS   — DMG, outside the Mac App Store (the transparent window needs
#             Tauri's macOSPrivateApi). Signed and notarized only when the
#             Apple secrets below exist.
#   Windows — MSI. Signed only when the certificate secrets exist.
#   Linux   — .deb and AppImage (Flatpak deferred).
#
# Nothing is ever *described* as signed: each job verifies the artifact
# (codesign/spctl/stapler, Get-AuthenticodeSignature) and writes what it
# found to SIGNING-<os>.txt, which goes into the release.
#
# Secrets (repository → Settings → Secrets; never pasted anywhere else):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD

name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create as a draft (e.g. desktop-v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
      HAS_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - run: npm ci

      - name: Tests before packaging
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package
        env:
          # Read by the Tauri bundler on macOS; empty → an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          [ -n "${{ matrix.target }}" ] && ARGS="$ARGS --target ${{ matrix.target }}"
          if [ -n "$WINDOWS_THUMBPRINT" ]; then
            ARGS="$ARGS --config {\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"
          fi
          if [ "$HAS_APPLE" != "true" ]; then unset APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD; fi
          npx tauri build $ARGS

      - name: Collect, verify signing, checksum
        run: |
          mkdir -p ../out
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} ../out/ \;
          cd ../out
          REPORT="SIGNING-${{ runner.os }}.txt"
          echo "Signing report for ${{ runner.os }} (${{ github.ref_name }}), generated by CI — not a claim, a verification:" > "$REPORT"
          for f in *; do
            case "$f" in
              *.dmg)
                MNT=$(hdiutil attach -nobrowse -readonly "$f" | grep -o '/Volumes/.*' | head -1)
                APP=$(ls -d "$MNT"/*.app | head -1)
                if codesign --verify --deep --strict "$APP" 2>/dev/null; then SIGNED=yes; else SIGNED=no; fi
                if spctl -a -t exec "$APP" 2>/dev/null; then GATE=accepted; else GATE=rejected; fi
                if xcrun stapler validate "$f" >/dev/null 2>&1; then NOTARIZED=yes; else NOTARIZED=no; fi
                hdiutil detach "$MNT" -quiet
                echo "$f: code-signed=$SIGNED gatekeeper=$GATE notarization-stapled=$NOTARIZED" >> "$REPORT" ;;
              *.msi)
                STATUS=$(pwsh -NoProfile -Command "(Get-AuthenticodeSignature '$f').Status")
                echo "$f: authenticode=$STATUS" >> "$REPORT" ;;
              *.deb|*.AppImage)
                echo "$f: not signed (Linux packages are distributed with SHA-256 checksums)" >> "$REPORT" ;;
            esac
          done
          (sha256sum * 2>/dev/null || shasum -a 256 *) | grep -v SIGNING > "SHA256SUMS-${{ runner.os }}.txt"
          cat "$REPORT" "SHA256SUMS-${{ runner.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          {
            echo "JARVIS desktop companion — draft. Review before publishing."
            echo
            echo "The companion presents JARVIS's activity; it never approves, confirms or runs anything."
            echo "Real user data is not cleared for this codebase yet (docs/PROJECT_STATUS.md)."
            echo
            echo '## Signing (verified by CI)'
            echo '```'
            cat SIGNING-*.txt
            echo '```'
            echo
            echo '## SHA-256'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > NOTES.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "JARVIS Companion ${TAG#desktop-v}" --notes-file NOTES.md \
            $(ls | grep -vE '^(NOTES\.md|SHA256SUMS-.*)$')
