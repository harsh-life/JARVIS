# Desktop companion releases (OD-DESK-3): GitHub Releases, as a *draft* the
# owner publishes by hand. Runbook: docs/DESKTOP_RELEASE.md.
#
#   macOS   — DMG, outside the Mac App Store (the transparent window needs
#             Tauri's macOSPrivateApi). Signed and notarized only when the
#             Apple secrets below exist.
#   Windows — MSI. Signed only when the certificate secrets exist.
#   Linux   — .deb and AppImage (Flatpak deferred).
#
# One tag, one commit (desktop/scripts/release_integrity.py):
#   - This workflow never creates a tag. The tag must already exist on the
#     remote, be named desktop-vX.Y.Z[-pre], peel to a commit on main, and name
#     the version the app declares (`resolve`).
#   - Every build checks out that exact commit, not the commit a manual run was
#     started from, and records it next to its artifacts (`inspect`).
#   - Before the draft is created, every record must name the same commit, every
#     artifact must match its recorded hash, and the tag must still point at
#     that commit (`assemble`, `resolve --expect-sha`). `gh release create
#     --verify-tag` cannot create a tag. The tag is checked once more after the
#     draft exists, and a mismatched draft is deleted.
#
# Manual runs only from main:
#   `workflow_dispatch` cannot be limited to a branch in the `on:` block, so a
#   manual run started from any ref runs *that ref's* copy of this file and of
#   the release tooling. Three layers, from weakest to strongest:
#     1. `guard` fails the run before anything else starts unless a manual run's
#        ref is exactly refs/heads/main (and a push run's ref is a desktop-v* tag).
#     2. `release_integrity.py resolve` refuses it again, and also requires the
#        commit it executes to be on main. Every job that holds a token or a
#        secret needs `guard` and `resolve`.
#     3. The `desktop-release` environment (below) is the only layer a branch
#        cannot edit away: its deployment-branch rule is enforced by GitHub.
#   1 and 2 are defense in depth and cannot stop someone who can push a branch
#   from editing them out of their own copy of this file. 3 can.
#
# Release tooling comes from `github.sha`, and `guard` guarantees that is a
# commit on main for a manual run (for a tag push, `resolve` requires the
# tagged commit to be on main). It is never taken from `inputs.*`, a branch name
# or a PR ref.
#
# Environment `desktop-release` (docs/DESKTOP_RELEASE.md, "Before the first
# release"): the `build` jobs run in it, so the signing secrets live there and
# nowhere else, and required reviewers approve each release before any signing
# secret is exposed. Create and protect it BEFORE the first run; GitHub creates
# an unprotected environment of that name if a job references one that does
# not exist.
#
# Nothing is ever *described* as signed. Each build verifies its artifacts
# with the platform's own tool (codesign -dvvv, Get-AuthenticodeSignature).
# Only a Developer ID (macOS) or a Valid Authenticode signature (Windows)
# counts as signed; an ad-hoc or linker signature does not. When a platform's
# signing secrets are configured but its artifact has no verified signature,
# that build fails. When anything is unsigned, the release title and notes say so.
#
# Secrets (the `desktop-release` ENVIRONMENT's secrets, not repository secrets,
# which any branch's workflow could read; never pasted anywhere else):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#
# No dependency cache is used here: a release builds from a clean slate.

name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag on main to build and draft (e.g. desktop-v0.1.0). Never created by this workflow."
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: manual runs only from main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: nothing from the repository runs before this passes. The
      # run fails (rather than being skipped) so a refused run is never green.
      - name: Refuse a manual run from any ref but main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            push)
              case "$REF" in
                refs/tags/desktop-v*) ;;
                *) echo "::error::a push run is for a desktop-v* tag, not $REF"; exit 1 ;;
              esac ;;
            workflow_dispatch)
              [ "$REF" = "refs/heads/main" ] || {
                echo "::error::manual releases run only from refs/heads/main; this run was started from $REF. Re-run it from main."
                exit 1
              } ;;
            *) echo "::error::unsupported trigger $EVENT"; exit 1 ;;
          esac
          echo "ok: $EVENT from $REF"

  resolve:
    name: resolve the release commit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # The release tooling comes from the workflow's own commit, so the
      # workflow and its checks always come from the same commit. `guard` has
      # established that this is main for a manual run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate the tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python desktop/scripts/release_integrity.py resolve \
            --event "$EVENT" --ref "$GITHUB_REF" --input-tag "$INPUT_TAG" --event-sha "$GITHUB_SHA"

  build:
    name: build (${{ matrix.os }})
    needs: [guard, resolve]
    # The signing secrets belong to this environment and are available to no
    # other job. Its required-reviewer rule is the approval gate and its
    # deployment-branch rule (main + desktop-v* tags) is enforced by GitHub, not
    # by this file. See the header comment before the first run.
    environment: desktop-release
    strategy:
      fail-fast: false   # each platform's evidence is kept; draft-release still needs all three
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
      HAS_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      # The product: exactly the resolved commit. No token is left in .git/config
      # while npm and cargo run third-party build code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # The release tooling, from the workflow's own commit (see `resolve`).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _release_tooling
          persist-credentials: false
          sparse-checkout: desktop/scripts/release_integrity.py
          sparse-checkout-cone-mode: false

      - name: The checkout is the resolved commit
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "building $RELEASE_TAG from $HEAD_SHA"
          [ "$HEAD_SHA" = "$RELEASE_SHA" ] || { echo "::error::checked out $HEAD_SHA, release is $RELEASE_SHA"; exit 1; }

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "$TARGET" = "universal-apple-darwin" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - run: npm ci

      - name: Shared ActivityPolicy + renderer + webview boundary (JS)
        if: runner.os == 'Linux'
        run: npm test

      - name: Tests before packaging
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          # Read by the Tauri bundler on macOS; empty → an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARGS=(--bundles "$BUNDLES")
          [ -n "$TARGET" ] && ARGS+=(--target "$TARGET")
          if [ -n "${WINDOWS_THUMBPRINT:-}" ]; then
            ARGS+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          if [ "$HAS_APPLE" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build "${ARGS[@]}"

      - name: Collect, verify signing, record the build
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          mkdir -p ../out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} ../out/ \;
          case "$RUNNER_OS_NAME" in
            macOS) EXPECT="$HAS_APPLE" ;;
            Windows) EXPECT="$HAS_WINDOWS" ;;
            *) EXPECT=false ;;
          esac
          python ../_release_tooling/desktop/scripts/release_integrity.py inspect \
            --source .. --out ../out --os "$RUNNER_OS_NAME" \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --expect-signed "$EXPECT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  draft-release:
    needs: [guard, resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      EVENT: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The tag still points at the built commit
        working-directory: tooling
        run: |
          python desktop/scripts/release_integrity.py resolve --event "$EVENT" --ref "$GITHUB_REF" \
            --input-tag "$INPUT_TAG" --event-sha "$GITHUB_SHA" --expect-sha "$RELEASE_SHA"

      - name: Check the builds belong together; write checksums, signing report, notes
        run: |
          python tooling/desktop/scripts/release_integrity.py assemble \
            --dist dist --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --meta-dir meta

      - name: Create the draft release (never creates a tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          mapfile -t ASSETS < ../meta/ASSETS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "$(cat ../meta/TITLE.txt)" --notes-file ../meta/NOTES.md -- "${ASSETS[@]}"

      - name: Re-check the tag after the draft exists
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python desktop/scripts/release_integrity.py resolve --event "$EVENT" --ref "$GITHUB_REF" \
              --input-tag "$INPUT_TAG" --event-sha "$GITHUB_SHA" --expect-sha "$RELEASE_SHA"; then
            echo "::error::the tag moved while the draft was created; deleting this run's draft (the tag is left alone)"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName \
            --jq 'if .isDraft then "draft \(.tagName) ready for review" else error("release is not a draft") end'
