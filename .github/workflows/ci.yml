# CI — the mechanical half of 16 §6 and 17 §2.
#
# 16 §6 `[LOCKED]`: "a boundary violation (e.g. `agent`->raw-`secrets`, or a
# server key in `android/`) is a **CI failure**, not a review nicety — because
# under heavy code generation, 'the reviewer will catch it' is not a reliable
# control."
#
# 17 §2 lists REPO-T7 ("the dependency rules are enforced in CI, and a
# deliberate violation fails the build") in the release-blocking set. A test that
# runs `lint-imports` only satisfies that hook if something runs the test on
# every push — which is what this workflow is for.
#
# Deliberately minimal: it runs exactly the checks a contributor runs locally
# (docs/RUNNING_SECURITY_CORE.md §10, docs/RUNNING_MEMORY.md §7), no more. The
# one network step is provisioning the public embedding model, the same command
# a self-hoster runs. Nothing here needs a `config.yaml`, a KEK, or any
# credential: the suites build their own throwaway config and generate a fresh
# key per test (17 §6 — "No fixture contains a real secret"), so CI requires no
# secrets at all. That is itself a property worth
# keeping: a CI job that needed the owner's credentials would contradict
# HOST-001.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject requires >=3.11; pin the floor so a syntax or typing
          # feature newer than the declared minimum fails here rather than on a
          # self-hoster's machine (HOST-001 — a fresh clone must run).
          python-version: "3.11"
          cache: pip

      - name: Install
        # `memory` is the pinned Mem0 / Chroma / fastembed stack (docs/21). CI
        # installs it so the real-store suites run — they are release-blocking.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,memory]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: embedder-bge-small-en-v1.5-fastembed-0.8.1

      - name: Provision the embedding model (15 §3 step 5)
        # The one sanctioned download, by the operator command a self-hoster
        # runs. Everything after this step loads the model offline; the egress
        # suites assert no test makes a network call.
        run: python -m server.memory provision --config config.example.yaml

      - name: Module boundary contracts (16 §8 — REPO-T1/T4/T6/T7)
        # First, and its own step: a boundary violation should be legible as
        # exactly that in the checks list, not buried in a test summary.
        run: lint-imports --config pyproject.toml

      - name: Tests
        env:
          HYPERMIND_REQUIRE_MEMORY_STACK: "1"
        run: python -m pytest tests/ -q --ignore=tests/memory

      - name: Memory release-blocking suite (17 §5, docs/21 §9 — MEM-T1..T10, MP-T1..T12)
        # Its own step so the real-data gate's evidence is legible in the checks
        # list. With HYPERMIND_REQUIRE_MEMORY_STACK=1 a missing store or model is
        # a failure, never a skip: MEM-T1 cannot pass by not running.
        # The PRD #32 acceptance is deselected here, by name, because it is a
        # property of the PostgreSQL runtime store (H-1) and refuses to run on
        # SQLite; the `postgres` job below runs it.
        env:
          HYPERMIND_REQUIRE_MEMORY_STACK: "1"
        run: python -m pytest tests/memory -q --ignore=tests/memory/test_prd32_service_measurement.py

      - name: Migrations round-trip
        # 15 §3 / STORE-004: migrations must be reproducible, and `downgrade
        # base` must actually work — a one-way migration is discovered at the
        # worst possible time.
        env:
          HYPERMIND_DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # The ORM models and the migrated schema agree (no drift a later
          # autogenerate would silently "fix").
          alembic check

      - name: BR-T2 blast-radius measurement (14 §4)
        # Re-measured on every run, with the table in the log. 14 §4's
        # deliverable is the measurement, so it is recorded as CI evidence
        # rather than as a claim in a document nobody re-runs.
        # The original eleven rows (relational store, SecretStore) plus the
        # execution dimensions integration made measurable (09/10, the process
        # executor) — docs/OD_A1_BR_T2.md §3/§4.
        # The memory rows (docs/21 MP-T12) re-measure with the real Mem0 store present.
        # The Android rows (docs/23 §9) measure the device client (§3d).
        env:
          HYPERMIND_REQUIRE_MEMORY_STACK: "1"
        run: python -m pytest tests/security_core/test_od_a1_br_t2.py tests/integration/test_br_t2_execution_rows.py tests/integration/test_br_t2_memory_rows.py tests/integration/test_br_t2_android_rows.py tests/integration/test_br_t2_unattended_rows.py -q -s

  postgres:
    # H-1 (docs/DECISION_REGISTER.md): the pilot's runtime store is PostgreSQL.
    # Every suite runs again on a real PostgreSQL server, the migrations
    # round-trip on it, and the PRD #32 ~10-user fairness acceptance runs here.
    # The server is a throwaway service container with trust authentication
    # on the job's private network, so there is still no credential anywhere:
    # not in this file, not in a secret, not in a fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hypermind_ci
          POSTGRES_DB: hypermind_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hypermind_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The suites create (and drop) one database per test on this server
      # (tests/dbsupport.py). Unreachable, they fail — they never fall back to
      # SQLite once this is set.
      HYPERMIND_TEST_DATABASE_URL: postgresql+asyncpg://hypermind_ci@127.0.0.1:5432/hypermind_ci
      HYPERMIND_REQUIRE_MEMORY_STACK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,memory]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: embedder-bge-small-en-v1.5-fastembed-0.8.1

      - name: Provision the embedding model (15 §3 step 5)
        run: python -m server.memory provision --config config.example.yaml

      - name: PostgreSQL is reachable (a failure, never a skip)
        run: |
          python - <<'EOF'
          import asyncio, os, asyncpg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["HYPERMIND_TEST_DATABASE_URL"]).set(drivername="postgresql")
          async def main():
              conn = await asyncpg.connect(url.render_as_string(hide_password=False))
              print(await conn.fetchval("SELECT version()"))
              await conn.close()
          asyncio.run(main())
          EOF

      - name: Migrations round-trip on PostgreSQL
        # 15 §3 / STORE-004 on the pilot's store: up, all the way down, up
        # again, and no drift between the models and the migrated schema.
        env:
          HYPERMIND_DATABASE_URL: postgresql+asyncpg://hypermind_ci@127.0.0.1:5432/hypermind_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests on PostgreSQL
        run: python -m pytest tests/ -q --ignore=tests/memory

      - name: Memory release-blocking suite on PostgreSQL
        run: python -m pytest tests/memory -q --ignore=tests/memory/test_prd32_service_measurement.py

      - name: "PRD #32 ~10-user fairness acceptance (H-1)"
        # Its own step, with the measured S1/S2 tables in the log. It refuses
        # to run on any store but PostgreSQL.
        run: python -m pytest tests/memory/test_prd32_service_measurement.py -q -s

  containers:
    # docs/29 §21, OD-AF-11/12 (Phase 6): the external runtime's boundary, for
    # real — rootless Podman with gVisor runsc, driven as the runner's own
    # unprivileged user, exactly as the server launches a run. AGENT-T12 (the
    # runtime reaches only its sockets) and AGENT-T13 (no provider key or
    # server secret reaches the container) are release-blocking, so a missing
    # stack is a failure here, never a skip. No secret is needed: runsc comes
    # from gVisor's signed apt repository, the probe image is public and
    # pulled by digest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install rootless Podman and gVisor runsc
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y podman uidmap runsc
          # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor;
          # rootless Podman needs them on this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          podman --runtime=runsc info --format '{{.Host.OCIRuntime.Name}}' | grep -qx runsc

      - name: Container boundary (AGENT-T12, AGENT-T13; docs/29 §21)
        env:
          HYPERMIND_REQUIRE_CONTAINER_STACK: "1"
          # GitHub's runner does not delegate cgroups to the runner user.
          HYPERMIND_CONTAINER_IGNORE_CGROUPS: "1"
        run: >-
          python -m pytest -q
          tests/execution/test_containers_live.py
          tests/execution/test_containers.py
          tests/execution/test_egress_proxy.py

  android:
    # docs/23 §8: Kotlin lint and unit tests from the first commit. Like the job
    # above, it needs no secret: the client ships none (REPO-T2), and the last
    # step proves that about the built APK rather than asserting it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Explicit: the action's default list still names the obsolete
          # `tools` package, which current sdkmanager no longer has.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint, detekt)
        run: ./gradlew --no-daemon ktlintCheck detekt

      - name: Unit tests — :contract on the JVM, :app under Robolectric
        # :contract recomputes the shared mapping's digest, so a hand-edited
        # shared/android/device_mapping.json fails here (the python job fails
        # if the table and the artifact differ).
        run: ./gradlew --no-daemon :contract:test :app:testDebugUnitTest

      - name: Build and Android lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug

      - name: APK carries no server secret (ANDC-T11, REPO-T2)
        working-directory: .
        run: python3 tests/tools/check_apk_secrets.py android/app/build/outputs/apk/debug/app-debug.apk
