[project]
name = "hypermind-track-b"
version = "0.1.0"
description = "JARVIS / Hypermind Track B — configurable, self-hostable personal-agent runtime (foundation branch)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyyaml>=6.0",
    # security-core additions:
    #  cryptography — AEAD (AES-GCM) for the SecretStore (12 §3) and Ed25519
    #    device credentials (03 §4.2 [REC]). 12 §3 requires authenticated
    #    encryption; hand-rolling it would be the wrong call.
    #  pyjwt[crypto] — id_token signature/claim validation (03 §2.3). Every
    #    check 03 §2.3 locks is still asserted explicitly in server/auth/oidc.py;
    #    PyJWT supplies the JOSE primitives, not the policy.
    #  httpx — the Google token/JWKS endpoints (03 §2.1). Already a dev dep for
    #    the test client; promoted to a runtime dep because GoogleOIDCProvider
    #    needs it outside tests.
    "cryptography>=42.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["server", "shared"]

# Encodes 16_REPOSITORY_MODULE_BOUNDARIES.md §2 as an enforceable dependency
# graph: a lower layer never imports an upper layer — REPO-T4/T7.
#
# security-core refinement (documented, not silent): foundation encoded the
# whole "control & policy" band as one layer of mutually *independent*
# siblings ("|"). 16 §2 does not actually forbid intra-layer dependencies —
# it locks exactly two rules, "a lower layer never imports an upper layer"
# and "cyclic dependencies are forbidden". The independent reading made two
# edges the architecture itself requires impossible to express:
#   * auth/graph/capabilities -> security, yet 02 §2 step 8 and 04 §3 require
#     every one of them to emit an AuditEvent; and
#   * anything -> secrets, yet 03 §3.1 stores the device credential there.
# So the band is refined into a strict *total order* instead. That is
# stricter than 16 §2 within the band (only one direction is expressible,
# and cycles become unrepresentable rather than merely forbidden), and it
# permits no edge 16 forbids. `graph | capabilities` stay mutually
# independent on purpose: 16 §5 treats them as the two halves of one authz
# engine, and keeping them independent is what stops the engine that
# *decides* a capability check from also being able to *grant* one — so
# server/graph consumes server/capabilities through structural Protocols
# (server/graph/ports.py), wired at the gateway composition root.
#
# `secrets` sits below `security` because 16 §2 places it in the foundation
# layer while `security` is control & policy; that is why the SecretStore
# audits through a port it defines itself (server/secrets/audit_port.py)
# rather than importing server.security (which would be a lower layer
# importing an upper one — the one rule 16 §2 locks).
#
# runtime-branch refinement (documented, not silent): foundation/security-core
# placed `agent | modeltools | tools | memory | vault | scheduler | voice`
# *above* `gateway`, before any of them had real code, purely so the package
# layout existed (see each package's placeholder `__init__.py`: "module-
# boundary contracts about this package are meaningful for later branches").
# The runtime branch is the first to give any of them real code, and doing so
# exposed that ordering as unworkable: `server/gateway` is Track B's one
# composition root (`server/gateway/security.py` already wires
# auth/graph/capabilities/secrets/storage together for exactly this reason),
# and a lower layer can never import an upper one (16 §2's own rule) — so with
# the old ordering `gateway` could never construct or wire `agent`. Verified
# empirically (`lint-imports`) before and after: no existing code imports
# `agent|modeltools|tools|memory|vault|scheduler|voice` from `gateway` or vice
# versa (they were unimplemented placeholders), so moving them below `gateway`
# changes zero existing behaviour and breaks no contract that was ever
# exercised. `models` (06's ModelProvider adapters — distinct from
# `server/storage`'s DB models) joins the same band as `tools`/`modeltools`:
# the pre-existing comment below already treated it as a peer of `tools` for
# secret access, so the layering now says so explicitly instead of leaving
# `models` unconstrained.
#
# This does **not** loosen anything `agent` was forbidden from reaching: the
# two explicit `forbidden` contracts just below stay in force regardless of
# layer position (they are independent of the `layers` contract, not derived
# from it), and a new one is added — `agent` is now also forbidden from
# `server.storage` and `server.gateway`, so the runtime orchestrator stays
# persistence- and framework-free by construction, receiving every
# capability it needs (authorize, invoke a model, dispatch a tool, hydrate
# memory, record an event, resolve its `AgentConfiguration`) as a
# constructor-injected Protocol implementation the gateway composition root
# supplies (`server/agent/ports.py`, wired in `server/gateway/runtime.py`) —
# the same "ports declared by the consumer, satisfied structurally by
# whatever the composition root builds" pattern `server/graph/ports.py`
# already established between graph and capabilities.
[[tool.importlinter.contracts]]
name = "Track B server layering (16 §2)"
type = "layers"
containers = ["server"]
layers = [
    "dashboard",
    "gateway",
    "agent | modeltools | models | tools | memory | vault | scheduler | voice",
    "auth",
    "graph | capabilities",
    "net | fs",
    "security",
    "secrets",
    "config | storage",
]

# 16 §3 (the most important rule): server.agent must never import
# server.secrets' resolution — REPO-T1, SECRET-002, INV-6.
[[tool.importlinter.contracts]]
name = "Agent never imports raw secrets resolution (16 §3, REPO-T1)"
type = "forbidden"
source_modules = ["server.agent"]
forbidden_modules = ["server.secrets"]

# Runtime-branch addition: the agent runtime is deterministic orchestration,
# not a data-access layer — 05_AGENT_RUNTIME.md's own determinism table (§11)
# and this branch's own architectural-quality instruction ("do not create...
# direct database access from model code") are both stronger than what plain
# layering would require now that `agent` sits below `gateway`. Every
# capability the runtime needs — persistence, the HTTP surface — arrives as an
# injected port (`server/agent/ports.py`); nothing in `server/agent` imports a
# session, a router, or an ORM model directly.
[[tool.importlinter.contracts]]
name = "Agent stays persistence- and framework-free (05 §11, runtime branch)"
type = "forbidden"
source_modules = ["server.agent"]
forbidden_modules = ["server.storage", "server.gateway"]

# 16 §5: dashboard is read-only observability — it cannot import secret
# resolution (DASH-002).
[[tool.importlinter.contracts]]
name = "Dashboard cannot import secrets (16 §5, DASH-002, REPO-T6)"
type = "forbidden"
source_modules = ["server.dashboard"]
forbidden_modules = ["server.secrets"]

# 16 §4: shared/schemas is the only thing both sides import — it must
# never import server-side code (that would invert the dependency
# direction the whole module-boundary model relies on).
[[tool.importlinter.contracts]]
name = "shared/schemas never imports server (16 §1/§4, REPO-T3)"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["server"]

# 16 §5: "`agent` cannot import `capabilities` to *grant* itself anything —
# it can only request via the runtime -> authz path." The model proposes;
# it never mutates the grant table that decides its own authority
# (PERM-001/002, INV-1/INV-8). Covered by the layering contract above as
# well, but stated separately because this is a named semantic rule and a
# future layering edit must not silently drop it.
[[tool.importlinter.contracts]]
name = "Agent cannot import the capability/authz engine (16 §5, INV-8)"
type = "forbidden"
source_modules = ["server.agent"]
forbidden_modules = ["server.capabilities", "server.graph"]

# 12 §2 / 16 §3: the SecretStore's resolution path is reachable only from
# the deterministic boundary. `server.dashboard` is already covered above;
# these are the other two modules 12 §6 names as places a secret must never
# reach. (server.tools/server.models are deliberately NOT here — 16 §3
# permits them to resolve *their own declared* secret_ref at the call
# boundary.)
[[tool.importlinter.contracts]]
name = "Memory/vault never resolve secrets (12 §6, GRAPH-009)"
type = "forbidden"
source_modules = ["server.memory", "server.vault"]
forbidden_modules = ["server.secrets"]

# 12 §4 / SUPER-001: superuser + master-key handling is a separate principal
# from the application runtime. The SecretStore defines the requester
# vocabulary (server/secrets/requester.py) and server.security decides who
# qualifies — never the reverse, or the store would be trusting the caller
# it is supposed to be mediating.
[[tool.importlinter.contracts]]
name = "SecretStore never imports the identity layer (12 §4, SUPER-001)"
type = "forbidden"
source_modules = ["server.secrets"]
forbidden_modules = ["server.security", "server.auth", "server.graph", "server.capabilities"]
