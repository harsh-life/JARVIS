[project]
name = "hypermind-track-b"
version = "0.1.0"
description = "JARVIS / Hypermind Track B — configurable, self-hostable personal-agent runtime (foundation branch)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.29",
    # H-1: PostgreSQL is the pilot's runtime store (multi-writer, so one user's
    # task never holds every other user's writes — PRD #32). SQLite stays for
    # development and the suites' throwaway stores.
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyyaml>=6.0",
    # security-core additions:
    #  cryptography — AEAD (AES-GCM) for the SecretStore (12 §3) and Ed25519
    #    device credentials (03 §4.2 [REC]). 12 §3 requires authenticated
    #    encryption; hand-rolling it would be the wrong call.
    #  pyjwt[crypto] — id_token signature/claim validation (03 §2.3). Every
    #    check 03 §2.3 locks is still asserted explicitly in server/auth/oidc.py;
    #    PyJWT supplies the JOSE primitives, not the policy.
    #  httpx — the Google token/JWKS endpoints (03 §2.1). Already a dev dep for
    #    the test client; promoted to a runtime dep because GoogleOIDCProvider
    #    needs it outside tests.
    "cryptography>=42.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    # scheduler (docs/22 §3): APScheduler's cron / one-shot trigger semantics.
    # Only the triggers are used — the job store is the application database's
    # own `scheduled_jobs` table, never APScheduler's pickling job store.
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
# The persistent-memory and Knowledge Vault stack (docs/21), exact pins:
#  mem0ai — Mem0 OSS, used as a library behind one adapter
#    (server/memory/mem0_provider.py), not forked. The adapter is validated
#    against this exact version and refuses to start on any other.
#  chromadb — the local vector store, one client per store (VAULT-003).
#  fastembed — runs BAAI/bge-small-en-v1.5 on ONNX Runtime, offline after
#    `python -m server.memory provision` (no torch, no model server).
#  dulwich — reads the Knowledge Vault's Git object store in-process, so vault
#    ingestion spawns no `git` process and opens no socket.
# Optional so a fresh clone without memory still installs and runs
# (`memory.enabled: false` is the default); CI installs it.
memory = [
    "mem0ai==2.2.1",
    "chromadb==1.5.9",
    "fastembed==0.8.1",
    "dulwich==1.2.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "shared*"]

# docs/29 §5: the shipped agent templates are repository data files.
[tool.setuptools.package-data]
"server.agents" = ["templates/*.yaml", "templates/README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Chroma warns when a collection is created with `embedding_function=None`.
    # That is deliberate: without it Chroma attaches its default ONNX embedding
    # function, which downloads a model on first use (hidden egress, docs/21 §2.1).
    "ignore:legacy embedding function config:DeprecationWarning",
]

[tool.importlinter]
root_packages = ["server", "shared"]
# Required for the "Tools/agent cannot reach raw process or socket primitives"
# contract below, whose forbidden_modules (subprocess, socket) are stdlib, not
# one of root_packages.
include_external_packages = true

# Encodes 16_REPOSITORY_MODULE_BOUNDARIES.md §2 as an enforceable dependency
# graph: a lower layer never imports an upper layer — REPO-T4/T7.
#
# security-core refinement (documented, not silent): foundation encoded the
# whole "control & policy" band as one layer of mutually *independent*
# siblings ("|"). 16 §2 does not actually forbid intra-layer dependencies —
# it locks exactly two rules, "a lower layer never imports an upper layer"
# and "cyclic dependencies are forbidden". The independent reading made two
# edges the architecture itself requires impossible to express:
#   * auth/graph/capabilities -> security, yet 02 §2 step 8 and 04 §3 require
#     every one of them to emit an AuditEvent; and
#   * anything -> secrets, yet 03 §3.1 stores the device credential there.
# So the band is refined into a strict *total order* instead. That is
# stricter than 16 §2 within the band (only one direction is expressible,
# and cycles become unrepresentable rather than merely forbidden), and it
# permits no edge 16 forbids. `graph | capabilities` stay mutually
# independent on purpose: 16 §5 treats them as the two halves of one authz
# engine, and keeping them independent is what stops the engine that
# *decides* a capability check from also being able to *grant* one — so
# server/graph consumes server/capabilities through structural Protocols
# (server/graph/ports.py), wired at the gateway composition root.
#
# `secrets` sits below `security` because 16 §2 places it in the foundation
# layer while `security` is control & policy; that is why the SecretStore
# audits through a port it defines itself (server/secrets/audit_port.py)
# rather than importing server.security (which would be a lower layer
# importing an upper one — the one rule 16 §2 locks).
#
# runtime refinement (documented, not silent): two layers are added.
#   * `composition` on top — the composition root. The gateway must host the
#     agent endpoints but sits below `agent`; the runtime must consult the
#     authorization engine but may not import it (16 §5 / INV-8). Both are
#     resolved by Protocols declared in the lower module
#     (server/gateway/agent_port.py, server/agent/ports.py) and satisfied here.
#     Nothing imports `composition` except the process entrypoint.
#   * `models` (06's ModelProvider adapters) below the application band, so the
#     runtime and model-tools can both use the normalized interface while the
#     application-band siblings stay mutually independent.
[[tool.importlinter.contracts]]
name = "Track B server layering (16 §2)"
type = "layers"
containers = ["server"]
layers = [
    "composition",
    "dashboard",
    "agent | agents | modeltools | tools | memory | vault | scheduler | voice | evaluation",
    "models",
    "gateway",
    "auth",
    "graph | capabilities",
    "execution",
    "net | fs",
    "security",
    "secrets",
    "config | storage",
]

# 16 §3 (the most important rule): server.agent must never import
# server.secrets' resolution — REPO-T1, SECRET-002, INV-6.
[[tool.importlinter.contracts]]
name = "Agent never imports raw secrets resolution (16 §3, REPO-T1)"
type = "forbidden"
source_modules = ["server.agent"]
forbidden_modules = ["server.secrets"]

# 16 §5: dashboard is read-only observability — it cannot import secret
# resolution (DASH-002).
[[tool.importlinter.contracts]]
name = "Dashboard cannot import secrets (16 §5, DASH-002, REPO-T6)"
type = "forbidden"
source_modules = ["server.dashboard"]
forbidden_modules = ["server.secrets"]

# 16 §4: shared/schemas is the only thing both sides import — it must
# never import server-side code (that would invert the dependency
# direction the whole module-boundary model relies on).
[[tool.importlinter.contracts]]
name = "shared/schemas never imports server (16 §1/§4, REPO-T3)"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["server"]

# 16 §5: "`agent` cannot import `capabilities` to *grant* itself anything —
# it can only request via the runtime -> authz path." The model proposes;
# it never mutates the grant table that decides its own authority
# (PERM-001/002, INV-1/INV-8). Covered by the layering contract above as
# well, but stated separately because this is a named semantic rule and a
# future layering edit must not silently drop it.
[[tool.importlinter.contracts]]
name = "Agent cannot import the capability/authz engine (16 §5, INV-8)"
type = "forbidden"
source_modules = ["server.agent"]
forbidden_modules = ["server.capabilities", "server.graph"]

# 12 §2 / 16 §3: the SecretStore's resolution path is reachable only from
# the deterministic boundary. `server.dashboard` is already covered above;
# these are the other two modules 12 §6 names as places a secret must never
# reach. (server.tools/server.models are deliberately NOT here — 16 §3
# permits them to resolve *their own declared* secret_ref at the call
# boundary.)
[[tool.importlinter.contracts]]
name = "Memory/vault never resolve secrets (12 §6, GRAPH-009)"
type = "forbidden"
source_modules = ["server.memory", "server.vault"]
forbidden_modules = ["server.secrets"]

# 12 §4 / SUPER-001: superuser + master-key handling is a separate principal
# from the application runtime. The SecretStore defines the requester
# vocabulary (server/secrets/requester.py) and server.security decides who
# qualifies — never the reverse, or the store would be trusting the caller
# it is supposed to be mediating.
[[tool.importlinter.contracts]]
name = "SecretStore never imports the identity layer (12 §4, SUPER-001)"
type = "forbidden"
source_modules = ["server.secrets"]
forbidden_modules = ["server.security", "server.auth", "server.graph", "server.capabilities"]

# 16 §5: "the agent-runtime's authorization path is not importable by tools to
# self-approve" and "agent cannot import capabilities to *grant* itself
# anything". Tools, model-tools, and model adapters may read the capability
# *registry* (to validate a contract), but can never reach the grant service,
# the confirmation service, the decision engine, or the runtime itself.
[[tool.importlinter.contracts]]
name = "Tools/models cannot reach the grant, confirmation, or decision paths (16 §5)"
type = "forbidden"
source_modules = ["server.tools", "server.modeltools", "server.models"]
forbidden_modules = [
    "server.capabilities.grants",
    "server.capabilities.confirmation",
    "server.graph",
    "server.agent",
]

# 06 §1 / 16 §3: a model adapter's key arrives through an injected KeyProvider,
# resolved at the composition root. The adapters themselves never import the
# SecretStore — stricter than 16 §3's permission, and it keeps key resolution in
# one reviewed place.
[[tool.importlinter.contracts]]
name = "Model adapters never import the SecretStore (06 §1, 16 §3)"
type = "forbidden"
source_modules = ["server.models", "server.modeltools"]
forbidden_modules = ["server.secrets"]

# INTEL-003 / 26: Track B works fully with the IntelligenceProvider disabled and
# no DecisionProvider exists. The runtime must not depend on either.
[[tool.importlinter.contracts]]
name = "Runtime never depends on Intelligence/Decision providers (INTEL-003, 26)"
type = "forbidden"
source_modules = ["server.agent", "server.tools", "server.memory"]
forbidden_modules = ["server.intelligence"]

# execution branch (09/10/07 §5) — a new layer, "execution", sits between
# `graph | capabilities` and `net | fs` (see the layers contract above): tools
# build an already-authorized ExecutionRequest and hand it to `server.execution`
# (the process/Android primitives + the layer's own typed contracts), which in
# turn calls `server.fs`/`server.net` for containment/egress. None of the three
# may reach upward into authorization (already excluded by the layers contract,
# since `graph | capabilities` sits above `execution`) or into secrets (below,
# stated explicitly here — this branch's adapters resolve no secret of their
# own; a tool that genuinely needs one resolves it itself, exactly as `06 §1`
# already permits for `server.tools`).
[[tool.importlinter.contracts]]
name = "Execution/fs/net never import secrets (12 §2, OD-D1)"
type = "forbidden"
source_modules = ["server.execution", "server.fs", "server.net"]
forbidden_modules = ["server.secrets"]

# 12 §4 / SUPER-001 / 02 §12 / 18 §5.4: superuser authority has exactly one
# origin — the out-of-band credential checked by `server.security.superuser` —
# and exactly one HTTP entry, `server.gateway.superuser_auth`. The operator
# control path built on it (the control port and routes, the supervisor service)
# is just as closed. No layer that could act on a user's, a model's, a tool's, a
# device's, or a worker's behalf may reach any of them: not directly, not
# through a chain of imports. Only `server.gateway` (whose routes are the entry)
# and `server.composition` (which wires them) are left able to. The dashboard is
# a source here too: it shows, it never acts (28 §0, DASH-002), so its future
# `/admin/*` views authenticate at the gateway and hand it data — the dashboard
# never holds superuser authority itself.
[[tool.importlinter.contracts]]
name = "Only the gateway reaches superuser authority (12 §4, SUPER-001)"
type = "forbidden"
source_modules = [
    "server.dashboard",
    "server.agent",
    "server.agents",
    "server.tools",
    "server.modeltools",
    "server.models",
    "server.memory",
    "server.vault",
    "server.scheduler",
    "server.voice",
    "server.intelligence",
    "server.evaluation",
    "server.auth",
    "server.graph",
    "server.capabilities",
    "server.execution",
    "server.fs",
    "server.net",
    "server.secrets",
    "server.config",
    "server.storage",
    "shared",
]
forbidden_modules = [
    "server.security.superuser",
    "server.gateway.superuser_auth",
    "server.gateway.control_port",
    "server.gateway.routers.control",
    "server.composition.supervisor",
    "server.composition.latch",
    # 20 §2.2: break-glass records are created only on superuser authority.
    # The executor reaches them through `server.execution.break_glass`'s
    # claim-only Protocol, the runtime through `SecurityPort.settle_break_glass`.
    "server.composition.break_glass",
    # 19 §9 / 28 §1: the Judge's control switches, the improvement review queue
    # (approve / reject / roll back) and the operator console are superuser
    # surfaces too. Nothing that could act for a user, a model, a tool, a
    # device, a worker — or the Judge itself — can reach them, so no evaluator
    # can approve its own candidate or turn its own stop ability on.
    "server.gateway.evaluation_control_port",
    "server.gateway.routers.evaluation_control",
    "server.gateway.console_port",
    "server.gateway.routers.admin",
    "server.composition.improvements",
    "server.composition.evaluation",
    "server.composition.console",
]

# 19 (JDG-T2): the Judge scores and recommends; it never authorizes, executes,
# resolves secrets, or reaches a tool. The layers contract above already keeps
# `server.agent` and `server.evaluation` independent of each other (the runtime
# never depends on the Judge); this names what the Judge may not reach below
# it. Its superuser/control/break-glass reach is closed by the contract above.
[[tool.importlinter.contracts]]
name = "The Judge is never an authority (19, JDG-T2)"
type = "forbidden"
source_modules = ["server.evaluation"]
forbidden_modules = [
    "server.capabilities",
    "server.graph",
    "server.secrets",
    "server.execution",
    "server.fs",
    "server.net",
    "server.tools",
    # Stage 5 additions: the Judge reaches no identity/step-up code, no
    # runtime (its only runtime-facing handle is the breaker's trip port,
    # injected by the composition root), no store it could write to directly,
    # no gateway, and no operator surface. Its audit rows, usage rows and
    # stored evaluations all go through ports the composition root satisfies.
    "server.auth",
    "server.agent",
    "server.modeltools",
    "server.memory",
    "server.vault",
    "server.scheduler",
    "server.voice",
    "server.dashboard",
    "server.intelligence",
    "server.gateway",
    "server.composition",
    "server.security.audit",
    "server.security.superuser",
]

# 19 §3 (JDG-T2): "server/agent must not import server/evaluation — the runtime
# never depends on the Judge". The layers contract already keeps the two
# application-band siblings apart; this names the rule so a layering edit can
# never silently drop it (same shape as INTEL-003).
[[tool.importlinter.contracts]]
name = "The runtime never depends on the Judge (19, JDG-T2)"
type = "forbidden"
source_modules = ["server.agent", "server.tools", "server.modeltools", "server.memory", "server.vault"]
forbidden_modules = ["server.evaluation"]

# REPO-T5 for the Judge: no raw process or socket of its own. Its model calls
# go through `server.models`' adapters (their HTTP client's socket use is
# indirect).
[[tool.importlinter.contracts]]
name = "The Judge opens no process or socket (19, REPO-T5)"
type = "forbidden"
source_modules = ["server.evaluation"]
forbidden_modules = ["subprocess", "socket"]
allow_indirect_imports = true

# 28 §0 / DASH-002 / DSH-T1: "the dashboard shows; controls live elsewhere".
# `server.dashboard` builds read-only views and reaches nothing that mutates or
# acts: not the runtime, a tool, a model, an execution primitive, the
# authorization engine or grant/confirmation services, identity, memory, the
# vault, the scheduler, voice, the Judge's service, the gateway or the
# composition root — and not the audit or usage *writers*. It reads rows
# through the storage models and live state through read-only Protocols it
# declares (`server/dashboard/ports.py`), which the composition root satisfies.
# Secret resolution and superuser authority are closed by the contracts above.
[[tool.importlinter.contracts]]
name = "The dashboard is read-only: no mutation or control path (28, DASH-002, DSH-T1)"
type = "forbidden"
source_modules = ["server.dashboard"]
forbidden_modules = [
    "server.agent",
    "server.agents",
    "server.tools",
    "server.modeltools",
    "server.models",
    "server.execution",
    "server.fs",
    "server.net",
    "server.capabilities",
    "server.graph",
    "server.auth",
    "server.memory",
    "server.vault",
    "server.scheduler",
    "server.voice",
    "server.evaluation",
    "server.intelligence",
    "server.gateway",
    "server.composition",
    "server.security.audit",
    "server.security.usage",
    "server.storage.idempotency",
    "subprocess",
    "socket",
]

# 09 §8 / 10 §3 (NET-005): the sandbox/egress boundary is worthless if an
# adapter can reach the host filesystem or a raw socket without going through
# it. `subprocess`/`socket` are the two stdlib doors that would let a tool
# bypass `server.fs`/`server.net` entirely; they are confined to the one module
# built to use them safely (`server.execution.process`, `server.net`'s egress
# client) rather than being reachable from the adapter/runtime layer directly.
[[tool.importlinter.contracts]]
name = "Tools/agent cannot reach raw process or socket primitives (09 §8/10 §3, REPO-T5)"
type = "forbidden"
source_modules = ["server.tools", "server.modeltools", "server.agent", "server.agents"]
forbidden_modules = ["subprocess", "socket"]
# Direct imports only. server.tools legitimately (and necessarily) depends
# transitively on socket through server.net's egress client, and on
# subprocess through server.execution.process — that dependency is the
# point, not the bypass. What this contract exists to catch is an adapter
# reaching for `import socket`/`import subprocess` itself instead of going
# through server.fs/server.net/server.execution, which only a direct-import
# check can distinguish from "uses a module that, three layers down, uses
# one of these".
allow_indirect_imports = true

# docs/21 / 11 §1 (VAULT-003, VAULT-004): persistent memory and the Knowledge
# Vault are separate stores. Neither package may import the other, directly or
# through a chain — so no code path in either can read the other's store.
# (The layers contract already keeps application-band siblings apart; this
# names the rule so a layering edit cannot silently drop it.)
[[tool.importlinter.contracts]]
name = "Memory and vault are separate stores (VAULT-003, MEM-T6/T7)"
type = "independence"
modules = ["server.memory", "server.vault"]

# docs/21 memory build: memory and the vault store and retrieve. They reach no
# control surface, no device, no scheduling, voice, judging or intelligence
# code, no runtime, tool, gateway or composition code, and no execution
# primitive — directly or indirectly. Superuser minting and raw secrets are
# closed by the contracts above.
[[tool.importlinter.contracts]]
name = "Memory/vault reach no control, device, scheduler, voice or judge code (docs/21)"
type = "forbidden"
source_modules = ["server.memory", "server.vault"]
forbidden_modules = [
    "server.dashboard",
    "server.scheduler",
    "server.voice",
    "server.evaluation",
    "server.intelligence",
    "server.execution",
    "server.agent",
    "server.tools",
    "server.modeltools",
    "server.gateway",
    "server.composition",
]

# docs/21 §2.1: Mem0 is a pinned dependency wrapped by one adapter. No other
# module may import it, so JARVIS depends on `MemoryProvider`, never on Mem0
# internals, and every hardening step in the adapter (telemetry off, no Mem0
# LLM, no history file, offline embedder) cannot be bypassed by a second import.
[[tool.importlinter.contracts]]
name = "Only the Mem0 adapter imports mem0 (docs/21 §2)"
type = "forbidden"
source_modules = ["server", "shared"]
forbidden_modules = ["mem0"]
ignore_imports = ["server.memory.mem0_provider -> mem0"]

# docs/22 §0/§2 (SCH-T2): the scheduler delivers messages and executes nothing.
# There is no principal at fire time, so it must not be able to reach anything
# that acts: the runtime, a tool, a model, a device operation (server.execution
# — its one route to a phone is a Protocol that carries only a DeviceReminder,
# satisfied at the composition root), the filesystem or network boundary, the
# grant / confirmation / decision engine (it asks nothing and grants nothing;
# the facade that authorizes the API path lives in server.composition), the
# SecretStore's resolution path, persistent memory, the vault, the Judge,
# voice, or the dashboard — directly or through a chain. Its audit rows go
# through server.security.audit, whose only secrets-side import is the
# string-typed audit port, so resolution modules are named individually.
[[tool.importlinter.contracts]]
name = "The scheduler never executes: no runtime, tool, device, authority, secret, memory or judge (docs/22, SCH-T2)"
type = "forbidden"
source_modules = ["server.scheduler"]
forbidden_modules = [
    "server.agent",
    "server.tools",
    "server.modeltools",
    "server.models",
    "server.execution",
    "server.fs",
    "server.net",
    "server.capabilities",
    "server.graph",
    "server.auth",
    "server.secrets.store",
    "server.secrets.kek",
    "server.secrets.crypto",
    "server.secrets.requester",
    "server.memory",
    "server.vault",
    "server.evaluation",
    "server.intelligence",
    "server.voice",
    "server.dashboard",
    "server.gateway",
    "server.composition",
]

# REPO-T5 for the scheduler: no raw process or socket of its own. (Indirect
# imports are allowed for the same reason as the tools contract above: the
# storage driver reaches `socket` three layers down; what must not exist is the
# scheduler opening one itself.)
[[tool.importlinter.contracts]]
name = "The scheduler opens no process or socket (docs/22, REPO-T5)"
type = "forbidden"
source_modules = ["server.scheduler"]
forbidden_modules = ["subprocess", "socket"]
allow_indirect_imports = true

# docs/27 §0: a voice is an input method, not an identity. The voice package
# produces text (a transcript) and audio, nothing more: it cannot reach
# authentication, the authorization engine, capability grants, confirmation or
# step-up (so no voice signal can satisfy either), the SecretStore (keys reach
# its adapters only as an opaque callable wired at the composition root),
# memory or the vault (audio and speaker signals never become memories), the
# runtime, tools, device execution, the scheduler, the Judge, or the gateway.
[[tool.importlinter.contracts]]
name = "Voice is an input method, not an identity or an authority (docs/27, VOI-T3/T4)"
type = "forbidden"
source_modules = ["server.voice"]
forbidden_modules = [
    "server.auth",
    "server.graph",
    "server.capabilities",
    "server.secrets.store",
    "server.secrets.kek",
    "server.secrets.crypto",
    "server.secrets.requester",
    "server.memory",
    "server.vault",
    "server.agent",
    "server.tools",
    "server.modeltools",
    "server.execution",
    "server.fs",
    "server.scheduler",
    "server.evaluation",
    "server.intelligence",
    "server.dashboard",
    "server.gateway",
    "server.composition",
]

# REPO-T5 for voice: no raw process or socket of its own (the HTTP client's own
# socket use is indirect).
[[tool.importlinter.contracts]]
name = "Voice opens no process or socket (docs/27, REPO-T5)"
type = "forbidden"
source_modules = ["server.voice"]
forbidden_modules = ["subprocess", "socket"]
allow_indirect_imports = true

# ── docs/29 — the Agent Factory (AF-C1…AF-C6) ─────────────────────────────
# `[PROPOSAL — NOT CANONICAL UNTIL RATIFIED]` (docs/29 §3.1, OD-AF-1). The
# factory sits in the application band beside the runtime (layers contract
# above), so it and `server.agent` cannot import each other: the native
# provider will start runs through a Protocol the composition root satisfies.
# The rule every contract below serves: NO MODEL OR AGENT RUNTIME CAN CREATE
# AUTHORITY.

# AF-C1: the factory never touches the SecretStore. Provider keys stay behind
# `server.models`' adapters, resolved by the existing path at the call.
[[tool.importlinter.contracts]]
name = "AF-C1: the Agent Factory never imports secrets (docs/29 §3.1)"
type = "forbidden"
source_modules = ["server.agents"]
forbidden_modules = ["server.secrets"]

# AF-C2: the deterministic core — ability table, registries, selector,
# compiler — is pure: no store, no runtime, no tool, no model adapter, no
# execution primitive, no grant or confirmation path, no authorization
# engine. It is tested without a database (docs/29 §9.1).
[[tool.importlinter.contracts]]
name = "AF-C2: the compiler, selector and registries are pure (docs/29 §3.1)"
type = "forbidden"
source_modules = [
    "server.agents.abilities",
    "server.agents.registry",
    "server.agents.selector",
    "server.agents.compiler",
    "server.agents.hashing",
    "server.agents.rendering",
]
forbidden_modules = [
    "sqlalchemy",
    "server.storage",
    "server.agent",
    "server.tools",
    "server.modeltools",
    "server.models",
    "server.execution",
    "server.fs",
    "server.net",
    "server.graph",
    "server.capabilities.grants",
    "server.capabilities.confirmation",
    "server.gateway",
    "server.composition",
    "server.agents.service",
]

# AF-C4: the scheduler still executes nothing. A reminder may one day carry an
# `agent_id` as data (docs/29 §17); the scheduler never imports the factory.
[[tool.importlinter.contracts]]
name = "AF-C4: the scheduler never imports the Agent Factory (docs/29 §17)"
type = "forbidden"
source_modules = ["server.scheduler"]
forbidden_modules = ["server.agents"]

# AF-C5: the Judge is never an authority — it cannot create, change or
# authorize an agent (docs/29 §18, AGENT-T26).
[[tool.importlinter.contracts]]
name = "AF-C5: the Judge never imports the Agent Factory (docs/29 §18)"
type = "forbidden"
source_modules = ["server.evaluation"]
forbidden_modules = ["server.agents"]

# AF-C6: agent state and notebooks are never read by authorization code.
[[tool.importlinter.contracts]]
name = "AF-C6: authorization never imports the Agent Factory (docs/29 §20.1)"
type = "forbidden"
source_modules = ["server.graph", "server.capabilities", "server.auth", "server.security"]
forbidden_modules = ["server.agents"]

