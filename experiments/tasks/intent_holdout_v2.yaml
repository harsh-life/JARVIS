# Phase 0.3 (docs/31 §11): the second HELD-OUT action-intent suite. 140
# requests, 10 per category in 14 categories. Written BEFORE any Phase 0.3
# recognizer change, and not run through any recognizer until the Phase 0.3
# rules were frozen. Its sha256 was recorded at creation (docs/31 §11.7).
#
# These labels are the FIRST annotator's (the same author as the rules). They
# are provisional until a second, independent human annotation has been
# collected and disagreements adjudicated (experiments/annotation/).
#
# Annotation rules (also in experiments/annotation/phase03_packet/INSTRUCTIONS.md):
#   classification  action: the user asks for a side effect and the operation is
#                   identifiable, even if details are missing; ambiguous: unclear
#                   WHETHER or WHICH side effect is wanted; informational: anything else
#                   (advice, assessment, hypotheticals, fiction, instructions
#                   someone else gave or that sit in the evidence, drafts).
#   route           action_status only if every action's target and every
#                   condition is complete; otherwise clarify; informational → answer.
#   per action: type, verb (lemma), target (keywords that must appear),
#     target_specified (false = must be asked), pronoun (target written as a
#     pronoun that had to be resolved), conditional, condition (keywords),
#     condition_kind (factual | temporal | user_step | vague), condition_complete,
#     approval ("only after I approve" is approval; "once I've checked it" is not), depends.
#   clear_informational: an informational item whose nature is not in doubt
#     (used for the unnecessary-clarification rate).
suite_id: intent_holdout.v2
