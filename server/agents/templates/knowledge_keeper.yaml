# docs/29 §5.5 — summarize what the owner already keeps. [PROPOSAL — NOT CANONICAL]
template_id: knowledge_keeper
version: 1
description: >-
  Reads the owner's JARVIS memory, knowledge vault and files in a sandbox the
  owner granted, and writes summaries or overviews for the owner's inbox.
  Read-only: it never changes memory, the vault or files.
task_tags: [knowledge_maintenance, summarization]
abilities: [read_user_memory, read_vault, read_sandbox_files]
run_mode: observe
risk_ceiling: low_read
required_model_features: [structured_output]
preferred_runtime: native
fallback_runtimes: []
min_isolation: in_process
memory_policy: {user_memory_read: true, vault_read: true, vault_domains: [], notebook: none}
trigger_support: [on_demand, reminder, unattended]
output_support: [inbox]
max_run_seconds: 120
max_model_calls_per_run: 12
max_tool_calls_per_run: 24
default_budget_per_run: 0.05
default_budget_per_month: 1.0
unattended_supported: true
supported_endpoints: [android, desktop]
required_infrastructure: [none]
priority: 5
