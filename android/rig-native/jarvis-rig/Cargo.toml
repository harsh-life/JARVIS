[package]
name = "jarvis-rig"
description = "JNI bridge between the JARVIS Android client and the Rigby2D runtime (the character player)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "jarvis_rig"
# cdylib: the Android .so (and the host library the JVM unit tests load); rlib: cargo test.
crate-type = ["cdylib", "rlib"]

[dependencies]
rigby-runtime = { path = "../rigby-runtime" }
# Raw JNI type and function-table bindings only (no transitive dependencies).
jni-sys = "=0.3.0"
