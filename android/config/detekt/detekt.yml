# Built on detekt's defaults (buildUponDefaultConfig). Adjusted only where a
# default fights Compose or a deliberately explicit style.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInObjects: 25
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 6
  WildcardImport:
    active: true
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 120
