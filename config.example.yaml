# Hypermind Track B — configuration template (15_CONFIGURATION_SELF_HOSTING.md).
#
# Copy this file to config.yaml (git-ignored) and edit it — never commit
# config.yaml. No value in this file, or in config.yaml, is ever a literal
# secret: every credential is a `secret_ref` in the form
#   env:SOME_ENV_VAR_NAME          (resolved from that env var at use)
#   secretstore:<handle>           (resolved via the SecretStore, 12_SECRETSTORE.md
#                                   — not implemented in the foundation branch)
# A literal-looking secret value here is a load-time validation failure by
# design (SECRET-004), not a warning.

server:
  host: "127.0.0.1"
  port: 8000
  base_url: "http://127.0.0.1:8000"
  tunnel:
    provider: "cloudflare"
    # config_ref: "env:CLOUDFLARE_TUNNEL_TOKEN"

agent:
  provider: "ollama"
  model: "qwen2.5:3b-instruct"
  # secret_ref: "env:AGENT_MODEL_API_KEY"   # unset/omit for a keyless local provider
  # A non-local provider MUST declare pricing (13 §3 — an unpriced paid call
  # cannot be budgeted, so it is a load-time failure):
  # pricing: { input_per_1k_tokens: 0.0, output_per_1k_tokens: 0.0 }
  # fallback: { provider: "ollama", model: "qwen2.5:1.5b-instruct" }   # 05 §5
  generation_policy: {}
  # 05 §3 runtime ceilings — every one exists and is enforced; values are OD-02.
  bounds:
    max_iterations: 12
    max_model_calls: 16
    max_tool_calls: 24
    max_model_tool_nesting_depth: 1
    wall_clock_timeout_seconds: 120
    per_task_budget: 0.0              # paid calls refused until raised
    memory_top_k: 5
  # 18 §5 circuit breaker — the count at which a task is stopped (emergency_stop).
  # Bounds, not authority: a stopped task is never resumed; start a new one.
  breaker:
    denial_limit: 5        # authorization denials in one task
    violation_limit: 3     # sandbox / egress / executable-allow-list refusals in one task
    rejection_limit: 3     # confirmations the user declined in one task
  # 18 §4 worker chain / supervisory recovery. Optional: without it, behaviour is
  # exactly as before (per-step primary -> fallback). With it, the task's worker
  # chain is [its resolved primary, fallback, *chain] and the supervisor switches
  # workers on outage, malformed output, stall, loop, or (if enabled) unresolved.
  # No worker in the chain gets any permission the task did not already have.
  # recovery:
  #   chain: []                      # extra operator-configured workers, in order
  #   max_worker_switches: 2
  #   escalate_on_unresolved: false  # never escalates to a paid worker (OD-SUP-3)
  #   stall_window: 3                # steps with no tool execution / activation
  #   loop_repeat_limit: 3           # identical (tool, operation, args) proposals

models_as_tools: []

tools: []

# Persistent memory (11, docs/21): self-hosted Mem0 OSS + a local Chroma store.
# Off by default. To turn it on (docs/RUNNING_MEMORY.md):
#   1. pip install -e '.[memory]'
#   2. python -m server.memory provision      # the one step that downloads (the embedding model)
#   3. set enabled: true
# The server itself never downloads a model and Mem0 never calls a model: Mem0 is
# a store here (docs/21 §2.2 option (a)); any model call memory needs is JARVIS's,
# metered like every other. There is no provider key to configure.
memory:
  enabled: false
  provider: "mem0"                 # the only adapter
  writes_enabled: true             # memory formation on/off; list/correct/delete stay available
  auto_extract: false              # extract facts at task end with the task's own (metered) model call
  max_fact_chars: 500
  max_facts_per_task: 3
  mem0:
    collection: "hypermind_memories"
    path: "./data/mem0_storage"    # owner-only (0700); plaintext at rest — see docs/RUNNING_MEMORY.md §5
    embedder: "bge-small-en-v1.5"
    embedder_cache: "./data/models"
    mode: "jarvis_extraction"      # the only mode

# Knowledge Vault (11 §7, docs/21 §5): curated markdown in a Git repository,
# indexed into its own store. Content changes only by Git commit + reindex:
#   python -m server.vault reindex
vault:
  enabled: false
  collection: "hypermind_vault"    # MUST differ from memory.mem0.collection (VAULT-003)
  git_backed: true                 # the only value in the pilot (OD-VLT-1)
  path: "./data/vault"             # the Git repository (source of truth)
  index_path: "./data/vault_index" # MUST NOT be, contain, or sit inside memory.mem0.path
  embedder: "bge-small-en-v1.5"
  embedder_cache: "./data/models"
  chunk_chars: 1200
  hydration_top_k: 3               # vault chunks added to a task's context (0 = none)
  hydration_max_chars: 3000

# Disabled by default (INTEL-003) — Track B is fully functional this way.
intelligence:
  enabled: false

voice: {}

# Execution branch (09 filesystem sandbox, 10 network egress, system.restricted
# process execution, 08's server-side Android dispatch). Every default here is
# the most restrictive one — see docs/RUNNING_EXECUTION.md.
execution:
  filesystem:
    base_root: "./data/sandboxes"
    containment_mode: "mediated"   # the only mode this branch implements
  network:
    enforcement_mode: "mediated_proxy"   # the only mode this branch implements
    default_destinations: []             # net.request has nowhere to go until you list one
    default_internet: false
    default_private_net: false
  process:
    allowed_executables: []              # system.restricted runs nothing until you list one
    confinement_mode: "landlock"         # the only value: kernel-confined, no reads outside system
                                          # dirs + task temp, no sockets. Where the kernel lacks
                                          # Landlock (e.g. macOS) nothing runs. There is no global
                                          # "unconfined" setting; see break_glass below.
    read_only_paths: []                  # extra read-only paths an allowed program needs
    # Break-glass (docs/20_CONFINEMENT_BREAK_GLASS.md): lets a SUPERUSER remove the kernel
    # layer from one task's system.restricted runs, for recovery, via
    # POST /api/v1/admin/control/break-glass. Such a child can read anything the server's OS
    # user can. Enabling this alone runs nothing unconfined. See docs/RUNNING_EXECUTION.md §5.1.
    break_glass:
      enabled: false
      allowed_executables: []            # its own list — never added to allowed_executables
      max_window_minutes: 15             # ceiling per activation (1–15)
      max_invocations: 1                 # ceiling per activation

# docs/23 — the Android client. Everything here is off until set; with the
# defaults every device operation fails `device_unavailable`.
android:
  enabled: false                       # the device channel (WebSocket transport)
  operation_ttl_seconds: 30            # device operation authority lifetime (5–60)
  app_links:
    # The stable public HTTPS origin (the named tunnel hostname that is also
    # the Google redirect URI host). Enables the browser → app login return.
    base_url: null                     # e.g. "https://jarvis.example.com"
    package_name: com.hypermind.jarvis
    # SHA-256 of the signing certificate(s) of the APK you install — public
    # values (`keytool -list -v -keystore <your.jks>`), never a key.
    sha256_cert_fingerprints: []
  # docs/CAPABILITY_MATRIX.md §5.1 — the owner's sensitive-app classification.
  # An app in none of these lists is UNCLASSIFIED: JARVIS may read it (with the
  # user's grant) but never tap, type, swipe, launch or stop it, and never
  # screenshot it. `sensitive` apps need confirmation for every UI action;
  # `payment` apps need confirmation plus fresh re-authentication. Screenshots
  # only ever of `non_sensitive` apps.
  app_classification:
    non_sensitive: []                  # e.g. [com.android.settings]
    sensitive: []                      # e.g. [com.whatsapp]
    payment: []                        # e.g. [com.google.android.apps.nbu.paisa.user]

security:
  oidc:
    client_id: "REPLACE_WITH_YOUR_OWN_GOOGLE_OIDC_CLIENT_ID"
    issuer: "https://accounts.google.com"
  rate_limits:
    per_user_requests_per_minute: 60     # metered model + tool calls (13 §2)
    per_device_requests_per_minute: 60
    global_requests_per_minute: 600
    per_session_concurrent_tasks: 1
    per_user_concurrent_tasks: 2
    global_concurrent_tasks: 8
  budgets:
    per_user_daily_cost_limit: 0.0
    global_daily_cost_limit: 0.0
  capability_defaults: {}

secrets:
  store: "encrypted_local"
  kek_source: "env:HYPERMIND_KEK"   # the KEK *source*, never the KEK itself

database_url: "sqlite+aiosqlite:///./data/hypermind.db"
